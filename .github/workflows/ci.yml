name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      # PostgreSQL para tests de integración
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: orderdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      # Kafka en modo KRaft
      kafka:
        image: apache/kafka:3.7.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
      
      # LocalStack para SQS
      localstack:
        image: localstack/localstack:3.7
        env:
          SERVICES: sqs
          AWS_DEFAULT_REGION: us-east-1
          EDGE_PORT: 4566
          DEBUG: 0
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
    
    steps:
      # Checkout del código
      - name: Checkout código
        uses: actions/checkout@v4
      
      # Configurar Java 21
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      
      # Inicializar LocalStack - Crear cola SQS
      - name: Inicializar LocalStack SQS
        run: |
          sleep 10
          aws --endpoint-url=http://localhost:4566 sqs create-queue --queue-name ordenes-procesadas-queue
          aws --endpoint-url=http://localhost:4566 sqs create-queue --queue-name ordenes-procesadas-dlq
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
      
      # Ejecutar build y tests (solo unit tests, los de integración usan testcontainers)
      - name: Build y Tests
        run: ./mvnw clean verify -DskipITs
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: orderdb
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          AWS_SQS_ENDPOINT: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          SPRING_PROFILES_ACTIVE: test
      
      # Mostrar resumen de coverage
      - name: Coverage Report
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f target/site/jacoco/index.html ]; then
            echo "✅ JaCoCo report generated successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📁 Report location: target/site/jacoco/" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No coverage report found" >> $GITHUB_STEP_SUMMARY
          fi
      
      # Subir reportes de test en caso de fallo
      - name: Subir reportes de test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
      
      # Subir cobertura de código
      - name: Subir cobertura de código
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/
      
      # Verificar status de éxito
      - name: Verificar build exitoso
        if: success()
        run: echo "✅ Build y tests completados exitosamente"
