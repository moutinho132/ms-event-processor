<!-- Botón flotante del chat -->
<div class="chat-button" (click)="toggleChat()" *ngIf="!isOpen">
  <span class="chat-icon">💬</span>
  <span class="chat-label">Chat IA</span>
</div>

<!-- Ventana de chat -->
<div class="chat-window" *ngIf="isOpen">
  <!-- Header -->
  <div class="chat-header">
    <div class="header-info">
      <span class="bot-avatar">🤖</span>
      <div class="header-text">
        <h3>OrderBot</h3>
        <span class="status">En línea</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-icon" (click)="clearChat()" title="Limpiar chat">
        🗑️
      </button>
      <button class="btn-icon close" (click)="toggleChat()" title="Cerrar">
        ✕
      </button>
    </div>
  </div>

  <!-- Mensajes -->
  <div class="chat-messages">
    <div *ngFor="let message of messages" 
         class="message" 
         [ngClass]="message.type">
      <div class="message-avatar">
        {{ message.type === 'user' ? '👤' : '🤖' }}
      </div>
      <div class="message-content">
        <div class="message-text" [innerHTML]="message.content | lineBreaks"></div>
        <div class="message-time">
          {{ message.timestamp | date:'shortTime' }}
        </div>
      </div>
    </div>

    <!-- Typing indicator -->
    <div class="message bot typing" *ngIf="isLoading">
      <div class="message-avatar">🤖</div>
      <div class="message-content">
        <div class="typing-indicator">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Sugerencias -->
  <div class="suggestions" *ngIf="suggestions.length > 0 && messages.length <= 2">
    <div class="suggestions-label">💡 Preguntas sugeridas:</div>
    <div class="suggestions-list">
      <button *ngFor="let suggestion of suggestions.slice(0, 3)" 
              class="suggestion-btn"
              (click)="useSuggestion(suggestion)">
        {{ suggestion }}
      </button>
    </div>
  </div>

  <!-- Input -->
  <div class="chat-input">
    <input type="text" 
           [(ngModel)]="currentQuestion"
           (keypress)="onKeyPress($event)"
           placeholder="Escribe tu pregunta..."
           [disabled]="isLoading">
    <button class="send-btn" 
            (click)="askQuestion()"
            [disabled]="!currentQuestion.trim() || isLoading">
      <span *ngIf="!isLoading">📤</span>
      <span *ngIf="isLoading">⏳</span>
    </button>
  </div>
</div>
