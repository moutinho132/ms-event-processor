<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <span class="logo">📦</span>
      <h1>MS-Event-Processor</h1>
      <p>{{ isLoginMode ? 'Inicia sesión en tu cuenta' : 'Crea una nueva cuenta' }}</p>
    </div>

    <!-- Error Message -->
    <div class="alert alert-error" *ngIf="error">
      <span>❌</span>
      <span>{{ error }}</span>
    </div>

    <!-- Success Message -->
    <div class="alert alert-success" *ngIf="success">
      <span>✅</span>
      <span>{{ success }}</span>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="login-form">
      <!-- Name (only for register) -->
      <div class="form-group" *ngIf="!isLoginMode">
        <label for="name">Nombre completo</label>
        <input 
          type="text" 
          id="name" 
          [(ngModel)]="name" 
          name="name"
          placeholder="Tu nombre"
          [required]="!isLoginMode">
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          [(ngModel)]="email" 
          name="email"
          placeholder="tu@email.com"
          required>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          [(ngModel)]="password" 
          name="password"
          placeholder="••••••••"
          required
          minlength="6">
      </div>

      <!-- Phone (only for register) -->
      <div class="form-group" *ngIf="!isLoginMode">
        <label for="phone">Teléfono (opcional)</label>
        <input 
          type="tel" 
          id="phone" 
          [(ngModel)]="phone" 
          name="phone"
          placeholder="+1 234 567 8900">
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="btn btn-primary btn-full"
        [disabled]="loading">
        <span *ngIf="!loading">{{ isLoginMode ? '🔐 Iniciar Sesión' : '📝 Registrarse' }}</span>
        <span *ngIf="loading">⏳ Cargando...</span>
      </button>
    </form>

    <!-- Toggle Mode -->
    <div class="login-footer">
      <p *ngIf="isLoginMode">
        ¿No tienes cuenta? 
        <a (click)="toggleMode()">Regístrate aquí</a>
      </p>
      <p *ngIf="!isLoginMode">
        ¿Ya tienes cuenta? 
        <a (click)="toggleMode()">Inicia sesión</a>
      </p>
    </div>

    <!-- Demo Info -->
    <div class="demo-info">
      <p>💡 <strong>Demo:</strong> Regístrate con cualquier email/contraseña</p>
    </div>
  </div>
</div>
