services:
  # MS-Event-Processor Application (Backend)
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ms-event-processor-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AWS_SQS_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      JWT_SECRET: your-production-secret-key-must-be-at-least-32-characters-long
      JWT_ISSUER: ms-event-processor
      # Ollama para Chat IA (alternativa local sin restricciones geográficas)
      # Ollama corre en el host, usamos host.docker.internal para acceder desde el contenedor
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - ms-event-processor-network
    restart: unless-stopped

  # Frontend (Angular)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ms-event-processor-frontend
    ports:
      - "4200:80"
    depends_on:
      - app
    networks:
      - ms-event-processor-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ms-event-processor-postgres
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ms-event-processor-network

  # Apache Kafka en modo KRaft (sin Zookeeper)
  kafka:
    image: apache/kafka:3.7.0
    container_name: ms-event-processor-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ms-event-processor-network

  # LocalStack Pro - AWS Local con UI completa
  localstack:
    image: localstack/localstack-pro:latest
    container_name: ms-event-processor-localstack
    environment:
      - LOCALSTACK_API_KEY=ls-ribIFujU-tAca-3793-4618-YegUWado1dec
      - SERVICES=sqs,sns,lambda,dynamodb,s3,cloudwatch,cloudformation,iam,sts,apigateway
      - AWS_DEFAULT_REGION=us-east-1
      - EDGE_PORT=4566
      - DEBUG=0
      - DOCKER_HOST=unix:///var/run/docker.sock
      - LOCALSTACK_HOST=localstack
      - PERSISTENCE=1
      - EAGER_SERVICE_LOADING=1
    ports:
      - "4566:4566"   # API Gateway
      - "4510-4559:4510-4559"   # Puertos para servicios externos
    volumes:
      - localstack_data:/var/lib/localstack
      - ./backend/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
      - ./backend/lambda:/var/lib/lambda:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ms-event-processor-network

volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local
  localstack_data:
    driver: local

networks:
  ms-event-processor-network:
    driver: bridge
