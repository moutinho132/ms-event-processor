spring:
  application:
    name: ms-event-processor-test
  
  # Configuración de hilos virtuales (Java 21)
  threads:
    virtual:
      enabled: true
  
  # Configuración de Kafka para tests
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: manual
    properties:
      spring.json.trusted.packages: "com.dev.app.dto"
  
  # Base de datos H2 en memoria para tests
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  
  # Configuración JPA para tests
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    open-in-view: false
  
  # Configuración AWS SQS LocalStack para tests
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: test
        secret-key: test
      sqs:
        endpoint: ${AWS_SQS_ENDPOINT:http://localhost:4566}
  
  # Configuración de Seguridad JWT para tests
  security:
    jwt:
      secret: test-secret-key-for-testing-must-be-at-least-32-characters-long
      issuer: test-issuer
      expiration: 3600000

# Configuración de Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Configuración de Logging para tests
logging:
  level:
    root: INFO
    com.dev.app: DEBUG
    org.springframework.kafka: INFO
    org.hibernate.SQL: DEBUG

# Configuración de Retry para tests
retry:
  max-attempts: 2
  initial-interval: 100
  multiplier: 2.0
  max-interval: 500

# Configuración de SQS para tests
sqs:
  queue:
    name: test-ordenes-procesadas-queue
    dlq-name: test-ordenes-procesadas-dlq
